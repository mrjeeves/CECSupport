# The CEC Support client's Rust crate.
#
# It lives OUTSIDE the repo's light root workspace (the root `Cargo.toml`
# excludes `gui`) so a `cargo build`/`cargo test` at the repo root stays fast
# and webview-free — exactly the split AllMyStuff and MyOwnMesh use. The empty
# `[workspace]` table makes this crate its own single-member workspace root.
#
# NOTE: this crate does NOT compile in the CEC Support sandbox. It depends on
# AllMyStuff's heavy node engine (webview + media stack: xcap / openh264 /
# cpal / …) via git, and on the CEC crates that are only pushed once the
# sibling AllMyStuff branch lands. The manifest and `src/main.rs` are written
# to be correct; the frontend (`pnpm check` / `pnpm build`) is what this repo
# validates. See the README's "What builds where" section.
[workspace]

[package]
name = "cec-support"
version = "0.2.38"
description = "CEC Support — the calm, customer-facing remote-help client for Critical Error Computing. Shows your support number, prompts you to approve or deny a technician, lists who has standing access, and can install itself as a background service."
authors = ["Chris Paul"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"
repository = "https://github.com/mrjeeves/CECSupport"

# One binary serves both the GUI (bare launch) and the CLI/service verbs
# (`cec-support run --service`, `cec-support service …`, `cec-support id`).
[[bin]]
name = "cec-support"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Sidecar download verification: build.rs checks each fetched release asset
# against its published `.sha256` before bundling it.
sha2 = "0.10"

[dependencies]
# `tray-icon` keeps CEC Support reachable from the notification area while it
# waits in the background for a technician.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# "Open CEC Support when this computer starts" — a per-user login item
# (Windows Run key / macOS LaunchAgent / Linux autostart), no admin needed.
tauri-plugin-autostart = "2"
# Single-instance guard: a second launch hands off to the running copy and
# exits, instead of standing up a rival client fighting over the node socket.
tauri-plugin-single-instance = "2"

# The shared AllMyStuff node engine — presence, the CEC connect handshake, the
# media planes, and the node control socket the client drives. Reused in "CEC
# client (customer) mode". Pinned to a published AllMyStuff release tag, so
# these resolve wherever that tag is reachable; bump all three together with
# `.allmystuff-rev`, which pins the `allmystuff-serve` sidecar to the same
# release (see build.rs — it stamps the tag in as ALLMYSTUFF_PIN).
allmystuff-node = { git = "https://github.com/mrjeeves/AllMyStuff", tag = "v0.2.55" }
# The CEC wire contract + Support-ID derivation, and the three-choice consent
# store — the customer's per-technician approvals.
allmystuff-cec-protocol = { git = "https://github.com/mrjeeves/AllMyStuff", tag = "v0.2.55" }
allmystuff-cec-consent = { git = "https://github.com/mrjeeves/AllMyStuff", tag = "v0.2.55" }

# The client's OWN OS-service installer (never AllMyStuff's), so installing the
# background service never clobbers an existing AllMyStuff install.
cec-support-service = { path = "../../crates/cec-support-service" }
# The access points THIS computer can see. A KVM with no network can't be asked
# what's nearby — which is exactly when someone is putting it on Wi-Fi — and only
# the Pro has a scan endpoint at all. The machine it's plugged into is in the
# same room on the same radio and already knows, including which network it is
# itself on. Lives in the light root workspace so CI compiles and tests it on all
# three platforms; this crate is excluded from that and builds on none of them.
cec-support-wifi = { path = "../../crates/cec-support-wifi" }
# The client's OWN self-updater. CEC keeps the engine *beneath* it current (it
# asks a reused `allmystuff-serve` to move to ALLMYSTUFF_PIN, which in turn
# keeps `myownmesh` current); this is the missing top of that chain — the thing
# that updates CEC Support itself. Self-contained by design: a git dep on
# AllMyStuff's updater would pin us to a released tag that can't carry
# not-yet-released fixes.
cec-support-updater = { path = "../../crates/cec-support-updater" }

# Async runtime — Tauri commands run on it; setup drives node bring-up + the
# event pump; the headless `run --service` agent blocks on it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }

# The KVM console client. These calls MUST NOT be made with the webview's
# `fetch`: the app's origin and the site tunnel's `http://localhost:<port>` are
# different origins, the appliance only sends CORS headers when its own auth is
# disabled (NanoKVM `main.go`: `if conf.Authentication == "disable"`), and the
# tunnel is a raw TCP proxy that adds none — so a browser fetch fails the
# preflight with an opaque "Failed to fetch". Going through Rust has no browser
# and therefore no CORS, and it lets a real status/body reach the UI.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
dirs = "5"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
